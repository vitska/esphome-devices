substitutions:
  friendly_name: "pw4-8266-ld2410b"

esphome:
  name: ${friendly_name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

# Enable logging
logger:
  # level: NONE
  hardware_uart: UART1

# Enable Home Assistant API
api:
  encryption:
    key: "xzKhXaYbvyz9IT3ttxdccZSWosC58Z+Wyl088Vc8acI="

ota:
  - platform: esphome
    password: "a1e1ad96698529056478ef6aee4c8438"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}-FH"
    password: "YrEZVMkk1kPl"

captive_portal:
    
# safe_mode:
#   disabled: true

uart:
  tx_pin: 1
  rx_pin: 3
  baud_rate: 256000

ld2410:

binary_sensor:
  - platform: ld2410
    has_target:
      name: Presence
    has_moving_target:
      name: Moving Target
    has_still_target:
      name: Still Target
    out_pin_presence_status:
      name: out pin presence status

sensor:
  - platform: ld2410
    light:
      name: light
    moving_distance:
      name : Moving Distance
    still_distance:
      name: Still Distance
    moving_energy:
      name: Move Energy
    still_energy:
      name: Still Energy
    detection_distance:
      name: Detection Distance

  - platform: uptime
    id: uptime_1
    name: "Uptime Sensor"

  - platform: wifi_signal
    id: wifi_signal_db
    name: "WiFi Signal"
    update_interval: 60s

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    icon: mdi:wifi

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    # mac_address:
    #   name: "Mac Address"
    scan_results:
      name: WiFi Scan Results

# time:
#   - platform: sntp
#     id: sntp_time
time:
  - platform: homeassistant
    id: esptime