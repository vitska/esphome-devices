substitutions:
  friendly_name: "rotary-k1"

esphome:
  name: rotary-k1
  friendly_name: rotary-k1

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api.rotary-k1

ota:
  - platform: esphome
    password: !secret ota.rotary-k1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Rotary-K1 Fallback Hotspot"
    password: !secret ap.rotary-k1

captive_portal:

i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a
  frequency: 800kHz
    
font:
  - file: "https://github.com/bluescan/proggyfonts/raw/refs/heads/master/ProggyVector/ProggyVector-Regular.ttf"
    id: font_small
    size: 12
  - file: "https://github.com/bluescan/proggyfonts/raw/refs/heads/master/ProggyVector/ProggyVector-Regular.ttf"
    id: font_big
    size: 18
  # - file: "MaterialIcons-Regular.ttf"
  #   id: icon_font_28
  #   size: 28
  #   glyphs: [
  #     "", # WiFi full
  #     "", # WiFi 2
  #     "", # WiFi 1
  #     "", # WiFi 0
  #     "" # no-wifi
  #   ]
display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    id: lcd
    i2c_id: bus_a
    address: 0x3C
    # contrast: 10%
    # invert: true
    pages:
      - id: page_id
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "WiFi");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
          it.printf(0, 14, id(font_small), TextAlign::TOP_LEFT, "SSID: %s", id(wifi_ssid).state.c_str());
          it.printf(0, 24, id(font_small), TextAlign::TOP_LEFT, "S: %.0fdb %.0f%%", id(wifi_signal_db).state, id(wifi_signal_percent).state);
          it.printf(0, 34, id(font_small), TextAlign::TOP_LEFT, "IP: %s", id(wifi_ip_address).state.c_str());
          it.printf(0, 44, id(font_small), TextAlign::TOP_LEFT, "N: ${friendly_name}");
      - id: page_led0
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "Led-1");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
        # it.printf(64, 20, id(font_big), TextAlign::TOP_CENTER, "%.0f%%", id(led0).current_values.get_brightness() * 100);
      - id: page_led1
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "Led-2");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
        # it.printf(64, 20, id(font_big), TextAlign::TOP_CENTER, "%.0f%%", id(led1).current_values.get_brightness() * 100);
      - id: page_led2
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "Led-3");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
        # it.printf(64, 20, id(font_big), TextAlign::TOP_CENTER, "%.0f%%", id(led2).current_values.get_brightness() * 100);
      - id: page_led3
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "Led-4");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
        # it.printf(64, 20, id(font_big), TextAlign::TOP_CENTER, "%.0f%%", id(led3).current_values.get_brightness() * 100);
      - id: page_led4
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "Led-5");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
        # it.printf(64, 20, id(font_big), TextAlign::TOP_CENTER, "%.0f%%", id(led4).current_values.get_brightness() * 100);
      - id: page_led5
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "Led-6");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
        # it.printf(64, 20, id(font_big), TextAlign::TOP_CENTER, "%.0f%%", id(led5).current_values.get_brightness() * 100);
      - id: page_led6
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "Led-7");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
        # it.printf(64, 20, id(font_big), TextAlign::TOP_CENTER, "%.0f%%", id(led6).current_values.get_brightness() * 100);
      - id: page_led7
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "Led-8");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
        # it.printf(64, 20, id(font_big), TextAlign::TOP_CENTER, "%.0f%%", id(led7).current_values.get_brightness() * 100);

binary_sensor:
  - platform: gpio
    id: button_encoder
    pin:
      number: 13
      inverted: true
      mode:
        input: true
        pullup: true
    on_click:
      - logger.log: "Button"
      - display.page.show_next: lcd
      - component.update: lcd
#      - display.page.show_previous: oled1

