  - platform: wifi_signal
    id: wifi_signal_db
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  - platform: copy # Reports the WiFi signal strength in %
    id: wifi_signal_percent
    source_id: wifi_signal_db
    name: "${friendly_name} WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    icon: mdi:wifi

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip_address
      name: "IP Address"
    ssid:
      id: wifi_ssid
      name: "Connected SSID"
    # mac_address:
    #   name: "Mac Address"
    scan_results:
      id: wifi_scan
      name: WiFi Scan Results

button:
  - platform: restart
    id: button_restart
    name: "Restart"

# time:
#   - platform: sntp
#     id: sntp_time
time:
  - platform: homeassistant
    id: esptime

event:
  - platform: template
    name: uplight_t
    id: uplight_t
    # Optional variables:
    # icon: "mdi:home-flood"
    device_class: button
    event_types: 
      - esphome.k1.uplight

    on_event:
      then:
        - logger.log: "esphome.uplight"
        - homeassistant.event:
            event: esphome.uplight
            data:
              message: "LED0"

