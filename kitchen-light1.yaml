            if (!isnan(nv) && abs(val - (int)(nv + 0.5f)) <= 1) return;
            if (at == 0) id(night_led1).make_call().set_value(val).perform();
            else if (at == 1) id(day_led1).make_call().set_value(val).perform();
            else id(custom_led1).make_call().set_value(val).perform();
    effects:
