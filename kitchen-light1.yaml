select:
  - platform: template
    name: "Active Template"
    id: active_template_select
    optimistic: true
    restore_value: true
    initial_option: "Day"
    options:
      - "Night"
      - "Day"
      - "Custom"
    set_action:
      - lambda: |-
          if (x == "Night") id(active_template) = 0;
          else if (x == "Day") id(active_template) = 1;
          else id(active_template) = 2;
          global_preferences->sync();
      - script.execute: apply_template

script:
  - id: apply_template
    mode: restart
    then:
      - lambda: 'id(template_switching) = true;'
      - light.turn_on:
          id: led0
          brightness: !lambda |-
            float v;
            if (id(active_template)==0) v=id(night_led0).state;
            else if (id(active_template)==1) v=id(day_led0).state;
            else v=id(custom_led0).state;
            return v / 255.0f;
      - light.turn_on:
          id: led1
          brightness: !lambda |-
            float v;
            if (id(active_template)==0) v=id(night_led1).state;
            else if (id(active_template)==1) v=id(day_led1).state;
            else v=id(custom_led1).state;
            return v / 255.0f;
      - light.turn_on:
          id: led2
          brightness: !lambda |-
            float v;
            if (id(active_template)==0) v=id(night_led2).state;
            else if (id(active_template)==1) v=id(day_led2).state;
            else v=id(custom_led2).state;
            return v / 255.0f;
      - light.turn_on:
          id: led3
          brightness: !lambda |-
            float v;
            if (id(active_template)==0) v=id(night_led3).state;
            else if (id(active_template)==1) v=id(day_led3).state;
            else v=id(custom_led3).state;
            return v / 255.0f;
      - light.turn_on:
          id: led4
          brightness: !lambda |-
            float v;
            if (id(active_template)==0) v=id(night_led4).state;
            else if (id(active_template)==1) v=id(day_led4).state;
            else v=id(custom_led4).state;
            return v / 255.0f;
      - light.turn_on:
          id: led5
          brightness: !lambda |-
            float v;
            if (id(active_template)==0) v=id(night_led5).state;
            else if (id(active_template)==1) v=id(day_led5).state;
            else v=id(custom_led5).state;
            return v / 255.0f;
      - light.turn_on:
          id: led6
          brightness: !lambda |-
            float v;
            if (id(active_template)==0) v=id(night_led6).state;
            else if (id(active_template)==1) v=id(day_led6).state;
            else v=id(custom_led6).state;
            return v / 255.0f;
      - light.turn_on:
          id: led7
          brightness: !lambda |-
            float v;
            if (id(active_template)==0) v=id(night_led7).state;
            else if (id(active_template)==1) v=id(day_led7).state;
            else v=id(custom_led7).state;
            return v / 255.0f;
      - delay: 6s
      - lambda: 'id(template_switching) = false;'

