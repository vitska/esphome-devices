substitutions:
  friendly_name: "rotary-k1"

esphome:
  name: kitchen-light1
  friendly_name: kitchen-light1
  on_boot:
    priority: -10
    then:
      - delay: 2s
      - script.execute: apply_template

esp8266:
  board: d1_mini
  restore_from_flash: true

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api.kitchen-light1

ota:
  - platform: esphome
    password: !secret ota.kitchen-light1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Kitchen-Light1 Fallback Hotspot"
    password: !secret ap.kitchen-light1

captive_portal:

globals:
  # Active template: 0=Night, 1=Day, 2=Custom
  - id: active_template
    type: int
    restore_value: true
    initial_value: '1'
  - id: template_switching
    type: bool
    initial_value: 'true'

i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a
  frequency: 400kHz

pca9685:
  - id: pca9685_hub1
    frequency: 500

# Individual outputs
output:
  - platform: pca9685
    pca9685_id: 'pca9685_hub1'
    channel: 0
    id: pwm0
  - platform: pca9685
    pca9685_id: 'pca9685_hub1'
    channel: 1
    id: pwm1
  - platform: pca9685
    pca9685_id: 'pca9685_hub1'
    channel: 2
    id: pwm2
  - platform: pca9685
    pca9685_id: 'pca9685_hub1'
    channel: 3
    id: pwm3
  - platform: pca9685
    pca9685_id: 'pca9685_hub1'
    channel: 4
    id: pwm4
  - platform: pca9685
    pca9685_id: 'pca9685_hub1'
    channel: 5
    id: pwm5
  - platform: pca9685
    pca9685_id: 'pca9685_hub1'
    channel: 6
    id: pwm6
  - platform: pca9685
    pca9685_id: 'pca9685_hub1'
    channel: 7
    id: pwm7

light:
  - platform: monochromatic
    id: led0
    name: 'led0'
    restore_mode: RESTORE_DEFAULT_ON
    output: pwm0
    default_transition_length: 5s
    on_state:
      then:
        - lambda: |-
            if (id(template_switching) || !id(led0).current_values.is_on()) return;
            float c = id(led0).current_values.get_brightness();
            if (fabs(c - id(led0).remote_values.get_brightness()) > 0.004f) return;
            int val = (int)(c * 255.0f + 0.5f);
            int at = id(active_template);
            float nv = (at == 0) ? id(night_led0).state : (at == 1) ? id(day_led0).state : id(custom_led0).state;
            if (!isnan(nv) && abs(val - (int)(nv + 0.5f)) <= 1) return;
            if (at == 0) id(night_led0).make_call().set_value(val).perform();
            else if (at == 1) id(day_led0).make_call().set_value(val).perform();
            else id(custom_led0).make_call().set_value(val).perform();
    effects:
      - random:
          transition_length: 5s
          update_interval: 5s
  - platform: monochromatic
    id: led1
    name: 'led1'
    restore_mode: RESTORE_DEFAULT_ON
    output: pwm1
