# Template brightness values (0-255) — visible and writable from HA
number:
  # Night template (~10%)
  - platform: template
    name: "Night LED0"
    id: night_led0
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 26
    set_action:
      - lambda: |-
          if (!id(template_switching) && id(active_template) == 0) {
            auto call = id(led0).turn_on(); call.set_brightness(x / 255.0f); call.perform();
          }
