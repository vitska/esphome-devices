display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    id: lcd
    i2c_id: bus_a
    address: 0x3C
    pages:
      - id: page_template
        lambda: |-
          const char* names[] = {"Night", "Day", "Custom"};
          int active = id(active_template);
          // WiFi signal indicator (5 bars)
          float db = id(wifi_signal_db).state;
          int level = 0;
          if (!isnan(db)) {
            if (db >= -50) level = 5;
            else if (db >= -60) level = 4;
            else if (db >= -70) level = 3;
            else if (db >= -80) level = 2;
            else if (db >= -90) level = 1;
          }
          for (int b = 0; b < 5; b++) {
            int x = b * 5;
            if (b < level) {
              int h = 3 + b * 2;
              it.filled_rectangle(x, 13 - h, 3, h);
            } else {
              it.filled_rectangle(x, 12, 3, 1);
            }
          }
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
          bool show_check = (millis() - id(applied_at)) < 3000 && id(applied_at) > 0;
          for (int i = 0; i < 3; i++) {
            int y = 14 + i * 12;
            it.printf(0, y, id(font_small), TextAlign::TOP_LEFT, "%s %s", (i == active) ? ">" : " ", names[i]);
            if (i == active && show_check) {
              int cx = 75, cy = y + 3;
              it.line(cx, cy + 3, cx + 2, cy + 5);
              it.line(cx + 2, cy + 5, cx + 6, cy);
            }
          }
          int cd = id(apply_countdown);
          if (cd > 0 && (millis() / 500) % 2 == 0) {
            it.printf(0, 50, id(font_small), TextAlign::TOP_LEFT, "Master: %s", id(master_state).state.c_str());
          } else if (cd <= 0) {
            it.printf(0, 50, id(font_small), TextAlign::TOP_LEFT, "Master: %s", id(master_state).state.c_str());
          }
          if (cd > 0) it.printf(80, 50, id(font_small), TextAlign::TOP_LEFT, "%d", cd);
          // Channel bar graph from active template
          int vals[8];
          if (active == 0) {
            vals[0]=id(night_led0); vals[1]=id(night_led1); vals[2]=id(night_led2); vals[3]=id(night_led3);
            vals[4]=id(night_led4); vals[5]=id(night_led5); vals[6]=id(night_led6); vals[7]=id(night_led7);
          } else if (active == 1) {
            vals[0]=id(day_led0); vals[1]=id(day_led1); vals[2]=id(day_led2); vals[3]=id(day_led3);
            vals[4]=id(day_led4); vals[5]=id(day_led5); vals[6]=id(day_led6); vals[7]=id(day_led7);
          } else {
            vals[0]=id(custom_led0); vals[1]=id(custom_led1); vals[2]=id(custom_led2); vals[3]=id(custom_led3);
            vals[4]=id(custom_led4); vals[5]=id(custom_led5); vals[6]=id(custom_led6); vals[7]=id(custom_led7);
          }
          // Graph boundary
          it.rectangle(88, 14, 40, 34);
          // 25/50/75% dashed markers
          for (int y = 15; y < 47; y += 2) {
            it.draw_pixel_at(98, y);
            it.draw_pixel_at(108, y);
            it.draw_pixel_at(118, y);
          }
          // Channel bars
          for (int i = 0; i < 8; i++) {
            int y = 16 + i * 4;
            int w = vals[i] * 38 / 255;
            if (w > 0) it.horizontal_line(89, y, w);
          }
      - id: page_wifi
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "WiFi");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
          it.printf(0, 14, id(font_small), TextAlign::TOP_LEFT, "SSID: %s", id(wifi_ssid).state.c_str());
          float dbm = id(wifi_signal_db).state;
          int pct = isnan(dbm) ? 0 : (int)fmin(fmax(2 * (dbm + 100.0), 0.0), 100.0);
          it.printf(0, 24, id(font_small), TextAlign::TOP_LEFT, "S: %.0fdb %d%%", dbm, pct);
          it.printf(0, 34, id(font_small), TextAlign::TOP_LEFT, "IP: %s", id(wifi_ip_address).state.c_str());
          it.printf(0, 44, id(font_small), TextAlign::TOP_LEFT, "Master: %s", id(master_state).state.c_str());
      - id: page_all
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "All Ch");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
          float vals[] = {
            id(led0_brightness).state, id(led1_brightness).state,
            id(led2_brightness).state, id(led3_brightness).state,
            id(led4_brightness).state, id(led5_brightness).state,
            id(led6_brightness).state, id(led7_brightness).state
          };
          // Graph boundary
          it.rectangle(4, 14, 120, 48);
          // 25/50/75% dashed markers
          for (int y = 15; y < 61; y += 2) {
            it.draw_pixel_at(34, y);
            it.draw_pixel_at(64, y);
            it.draw_pixel_at(94, y);
          }
          // Channel bars
          for (int i = 0; i < 8; i++) {
            int y = 17 + i * 6;
            int v = isnan(vals[i]) ? 0 : (int)vals[i];
            int w = v * 116 / 255;
            if (w > 0) it.filled_rectangle(5, y, w, 4);
          }
      - id: page_led0
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "Led-1");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
          float val = id(led0_brightness).state;
          int pct = isnan(val) ? 0 : (int)(val / 255.0f * 100.0f);
          it.printf(64, 20, id(font_big), TextAlign::TOP_CENTER, "%d%%", pct);
          it.rectangle(4, 48, 120, 12);
          int fill = (int)(pct / 100.0f * 116);
          if (fill > 0) it.filled_rectangle(6, 50, fill, 8);
      - id: page_led1
        lambda: |-
          it.printf(10, 0, id(font_small), TextAlign::TOP_LEFT, "Led-2");
          it.strftime(68, 0, id(font_small), TextAlign::TOP_LEFT, "%H:%M:%S", id(esptime).now());
          float val = id(led1_brightness).state;
          int pct = isnan(val) ? 0 : (int)(val / 255.0f * 100.0f);
          it.printf(64, 20, id(font_big), TextAlign::TOP_CENTER, "%d%%", pct);
          it.rectangle(4, 48, 120, 12);
          int fill = (int)(pct / 100.0f * 116);
