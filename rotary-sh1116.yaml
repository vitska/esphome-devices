substitutions:
  friendly_name: "rotary-sh1116"

esphome:
  name: rotary-sh1116
  friendly_name: rotary-sh1116
  on_boot:
    priority: 600
    then:
      - lambda: 'id(template_switching) = true;'

esp8266:
  board: esp01_1m
  restore_from_flash: true

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api.rotary-sh1116
  on_client_connected:
    then:
      - lambda: 'id(template_switching) = true;'
      - delay: 5s
      - script.execute: apply_template

ota:
  - platform: esphome
    password: !secret ota.rotary-sh1116

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Rotary-SH1116 Fallback Hotspot"
    password: !secret ap.rotary-sh1116

captive_portal:

i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a
  frequency: 800kHz

globals:
  - id: last_activity
    type: unsigned long
    initial_value: '0'
  - id: active_template
    type: int
    restore_value: true
    initial_value: '1'
  - id: apply_countdown
    type: int
    initial_value: '0'
  - id: template_switching
    type: bool
    initial_value: 'false'
  - id: applied_at
    type: unsigned long
    initial_value: '0'
  - id: all_step
    type: int
    initial_value: '0'
  - id: apply_idx
    type: int
    initial_value: '0'
  - id: ch_num
    type: int
    initial_value: '0'
  - id: ch_step
    type: int
    initial_value: '0'
  # Night template brightness per LED (~10%)
  - id: night_led0
    type: int
    restore_value: true
    initial_value: '26'
  - id: night_led1
    type: int
    restore_value: true
    initial_value: '26'
  - id: night_led2
    type: int
