binary_sensor:
  - platform: gpio
    id: button_confirm
    pin:
      number: 2
      inverted: true
      mode:
        input: true
        pullup: true
    on_click:
      - display.page.show_next: lcd
      - component.update: lcd
      - script.execute: reset_activity
  - platform: gpio
    id: button_back
    pin:
      number: 0
      inverted: true
      mode:
        input: true
        pullup: true
    on_click:
      - display.page.show_previous: lcd
      - component.update: lcd
      - script.execute: reset_activity
  - platform: gpio
    id: button_encoder
    pin:
      number: 13
      inverted: true
      mode:
        input: true
        pullup: true
    on_click:
      max_length: 1000ms
      then:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.tz3000_ji4araar_ts0011
        - component.update: lcd
        - script.execute: reset_activity

sensor:
  - platform: homeassistant
    id: led0_brightness
    entity_id: light.kitchen_light1_led0
    attribute: brightness
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!id(template_switching) && !isnan(x)) {
              int val = (int)x;
              if (id(active_template) == 0) id(night_led0) = val;
              else if (id(active_template) == 1) id(day_led0) = val;
              else id(custom_led0) = val;
            }
  - platform: homeassistant
    id: led1_brightness
    entity_id: light.kitchen_light1_led1
    attribute: brightness
    internal: true
    on_value:
      then:
