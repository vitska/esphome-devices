text_sensor:
  - platform: homeassistant
    id: master_state
    entity_id: light.tz3000_ji4araar_ts0011
    internal: true
    on_value:
      then:
        - if:
            condition:
              text_sensor.state:
                id: master_state
                state: "on"
            then:
              - script.execute: delayed_apply
            else:
              - script.stop: delayed_apply
              - lambda: |-
                  id(template_switching) = false;
                  id(apply_countdown) = -1;
              - component.update: lcd
              - delay: 3s
              - lambda: 'if (id(apply_countdown) < 0) id(apply_countdown) = 0;'
              - component.update: lcd
