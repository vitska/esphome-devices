  - platform: rotary_encoder
    name: "Rotary Encoder"
    id: encoder
    pin_a:
      number: 14
      mode:
        input: true
        pullup: true
    pin_b:
      number: 12
      mode:
        input: true
        pullup: true
    on_clockwise:
      - if:
          condition:
            display.is_displaying_page: page_template
          then:
            - lambda: |-
                id(active_template) = (id(active_template) + 2) % 3;
                global_preferences->sync();
            - script.execute: apply_template
      - lambda: |-
          auto p = id(lcd).get_active_page();
          int ch = -1;
          if (p == id(page_all)) { id(all_step) = 25; id(adjust_all).execute(); }
          else if (p == id(page_led0)) ch = 0;
          else if (p == id(page_led1)) ch = 1;
          else if (p == id(page_led2)) ch = 2;
          else if (p == id(page_led3)) ch = 3;
          else if (p == id(page_led4)) ch = 4;
          else if (p == id(page_led5)) ch = 5;
          else if (p == id(page_led6)) ch = 6;
          else if (p == id(page_led7)) ch = 7;
          if (ch >= 0) { id(ch_num) = ch; id(ch_step) = 25; id(adjust_channel).execute(); }
      - script.execute: reset_activity
      - component.update: lcd
    on_anticlockwise:
      - if:
          condition:
            display.is_displaying_page: page_template
          then:
            - lambda: |-
                id(active_template) = (id(active_template) + 1) % 3;
                global_preferences->sync();
            - script.execute: apply_template
      - lambda: |-
          auto p = id(lcd).get_active_page();
          int ch = -1;
          if (p == id(page_all)) { id(all_step) = -25; id(adjust_all).execute(); }
          else if (p == id(page_led0)) ch = 0;
          else if (p == id(page_led1)) ch = 1;
          else if (p == id(page_led2)) ch = 2;
          else if (p == id(page_led3)) ch = 3;
          else if (p == id(page_led4)) ch = 4;
          else if (p == id(page_led5)) ch = 5;
          else if (p == id(page_led6)) ch = 6;
          else if (p == id(page_led7)) ch = 7;
          if (ch >= 0) { id(ch_num) = ch; id(ch_step) = -25; id(adjust_channel).execute(); }
      - script.execute: reset_activity
      - component.update: lcd

