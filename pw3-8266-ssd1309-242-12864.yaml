substitutions:
  friendly_name: "pw3-8266-ssd1309-242-12864"

esphome:
  name: ${friendly_name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api.pw3

ota:
  - platform: esphome
    password: !secret ota.pw3

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}-FH"
    password: !secret ap.pw3

captive_portal:
    
# safe_mode:
#   disabled: true

i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a
  frequency: 800kHz

sensor:
  - platform: uptime
    id: uptime_1
    name: "Uptime Sensor"

  - platform: wifi_signal
    id: wifi_signal_db
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "${friendly_name} WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    icon: mdi:wifi
    
font:
  - file: "https://github.com/bluescan/proggyfonts/raw/refs/heads/master/ProggyVector/ProggyVector-Regular.ttf"
    id: font_1
    size: 26

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    i2c_id: bus_a
    address: 0x3C
    contrast: 10%
    # invert: true
    lambda: |-
      it.strftime(64, 0, id(font_1), TextAlign::TOP_CENTER, "%H:%M:%S", id(esptime).now());
      it.printf(0, 10, id(font_1), TextAlign::TOP_LEFT, "Uptime: 123");
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    # mac_address:
    #   name: "Mac Address"
    scan_results:
      name: WiFi Scan Results

# time:
#   - platform: sntp
#     id: sntp_time
time:
  - platform: homeassistant
    id: esptime