substitutions:
  friendly_name: "pw1" # Actually this is just a demo for LCD displaying HA temperature value and internet time
  project_version: "1.1"
  sensor_update_interval: 2s

esphome:
  name: pw1
  friendly_name: pw1

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api.pw1

ota:
  - platform: esphome
    password: !secret ota.pw1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Pw1 Fallback Hotspot"
    password: !secret ap.pw1

i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a
  frequency: 400kHz
    
font:
  - file: "Comic Sans MS 400.ttf"
    id: font_20
    size: 20
  - file: "Comic Sans MS 400.ttf"
    id: font_42
    size: 42
  - file: "MaterialIcons-Regular.ttf"
    id: icon_font_28
    size: 28
    glyphs: [
      "", # WiFi full
      "", # WiFi 2
      "", # WiFi 1
      "", # WiFi 0
      "" # no-wifi
    ]
display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    i2c_id: bus_a
    address: 0x3C
    update_interval: 500ms
    lambda: |-
      // Print "Mitt Smarta Hus" in top center.
      it.printf(64, -8, id(font_42), TextAlign::TOP_CENTER, "%s%.1f°", id(outside_temperature).state > 0 ? "+" : "", id(outside_temperature).state);

      // Print time in HH:MM format
      it.strftime(48, 40, id(font_20), TextAlign::TOP_CENTER, "%H:%M:%S", id(esptime).now());

      it.printf(100, 36, id(icon_font_28), TextAlign::TOP_LEFT, "");

captive_portal:
    
sensor:
  - platform: uptime
    name: "Uptime Sensor"

  - platform: wifi_signal
    id: wifi_signal_db
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "${friendly_name} WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    icon: mdi:wifi

  - platform: homeassistant
    id: outside_temperature
    entity_id: sensor.toe2_temperature
    internal: true
    accuracy_decimals: 1

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    # mac_address:
    #   name: "Mac Address"
    scan_results:
      name: WiFi Scan Results

# time:
#   - platform: sntp
#     id: sntp_time
time:
  - platform: homeassistant
    id: esptime