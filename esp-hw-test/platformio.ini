; PlatformIO Project Configuration
; ESP8266 D1 Mini Hardware Test

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Build flags
build_flags =
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_WIFI

; Libraries for I2C testing
lib_deps =
    Wire
